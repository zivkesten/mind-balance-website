<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Ensures proper rendering and touch zooming on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon (you can replace with your own) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- HTML title shown in browser tab -->
    <title>Michelle Coaching</title>

    <!--
      Notice how %PUBLIC_URL% works:
      <link rel="stylesheet" href="%PUBLIC_URL%/styles.css" />
      It will be replaced with the final folder path at build time.
    -->
  </head>
  <body>
    <!--
      The React app mounts into this div.
      Do not remove or rename it.
    -->
    <div id="root"></div>

    <!--
      In CRA, this is injected at build:
      <script src="/static/js/bundle.js"></script>
    -->
  </body>
</html>
